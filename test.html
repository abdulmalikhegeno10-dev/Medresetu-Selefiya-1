<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Firebase Test</title>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="status">Testing...</div>
    <button onclick="testFirestore()">Test Firestore Write</button>
    <div id="result"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
          apiKey: "AIzaSyDNthcUeBntlUnfEChPOTUHpJLr-eQZIuk",
          authDomain: "medresetu-selefiya-1.firebaseapp.com",
          projectId: "medresetu-selefiya-1",
          storageBucket: "medresetu-selefiya-1.firebasestorage.app",
          messagingSenderId: "782147862134",
          appId: "1:782147862134:web:c44071561521d8e6b7e957"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).then(() => {
            document.getElementById('status').innerHTML = '✅ Firebase Connected!';
        }).catch(error => {
            document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
        });

        window.testFirestore = async function() {
            try {
                const docRef = await addDoc(collection(db, 'test'), {
                    message: 'Hello from test!',
                    timestamp: serverTimestamp()
                });
                document.getElementById('result').innerHTML = '✅ Document written! ID: ' + docRef.id;
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
