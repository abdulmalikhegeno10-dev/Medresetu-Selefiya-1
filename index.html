<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 ኢስላማዊ የቀጥታ ስርጭት</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <h1>🕌 ኢስላማዊ የቀጥታ ትምህርት</h1>
            <p class="tagline">መምህራንን በቀጥታ ተከታተል</p>
        </header>

        <!-- Prayer Time Widget -->
        <div class="prayer-widget" id="prayerWidget">
            <span class="next-prayer">የሚቀጥለው ሰላት: <strong id="nextPrayer">...</strong></span>
            <span class="prayer-time" id="prayerTime">...</span>
        </div>

        <!-- Teacher Dashboard Button -->
        <div class="action-buttons">
            <button class="btn-primary" onclick="location.href='teacher.html'">
                🎥 መምህር ነኝ - Live መጀመር
            </button>
        </div>

        <!-- Live Streams Section -->
        <div class="section">
            <h2>🔴 በቀጥታ ላይ ያሉ ትምህርቶች</h2>
            <div id="liveStreams" class="streams-grid">
                <div class="loading">Loading streams...</div>
            </div>
        </div>

        <!-- Upcoming Streams -->
        <div class="section">
            <h2>📅 በቅርቡ የሚመጡ ትምህርቶች</h2>
            <div id="upcomingStreams" class="streams-grid">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button class="category active" data-cat="all">🌟 ሁሉም</button>
            <button class="category" data-cat="quran">📖 ቁርአን</button>
            <button class="category" data-cat="hadith">📚 ሃዲስ</button>
            <button class="category" data-cat="fiqh">⚖️ ፍቅህ</button>
            <button class="category" data-cat="seerah">👤 ሴራህ</button>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module" src="firebase-config.js"></script>
    
    <!-- App.js will load after Firebase is ready -->
    <script type="module">
        // Wait 2 seconds for Firebase to fully initialize
        setTimeout(() => {
            import('./app.js');
        }, 2000);
    </script>
</body>
</html
