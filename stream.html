<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 Live Stream - Advanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d5f3f;
            --accent: #d4af37;
            --bg: #0f1419;
            --card-bg: #1a1f2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            overflow: hidden;
        }

        .stream-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: 100vh;
        }

        /* Main Video Area */
        .main-video-section {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .audio-live-mode {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a3a1a 0%, #0f1419 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .teacher-avatar-large {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            border: 5px solid var(--accent);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        .teacher-info-overlay {
            text-align: center;
        }

        .teacher-name-large {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .stream-title-large {
            font-size: 20px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .audio-wave-animation {
            display: flex;
            gap: 5px;
            height: 80px;
            align-items: flex-end;
        }

        .wave-bar {
            width: 10px;
            background: var(--accent);
            border-radius: 5px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.3s; }
        .wave-bar:nth-child(7) { animation-delay: 0.2s; }
        .wave-bar:nth-child(8) { animation-delay: 0.1s; }

        @keyframes wave {
            0%, 100% { height: 20px; opacity: 0.5; }
            50% { height: 80px; opacity: 1; }
        }

        /* Top Overlay */
        .top-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(229, 62, 62, 0.95);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .stream-stats {
            display: flex;
            gap: 15px;
        }

        .stat-badge {
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Bottom Overlay */
        .bottom-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .teacher-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .teacher-details h3 {
            font-size: 18px;
            color: var(--accent);
        }

        .teacher-details p {
            font-size: 14px;
            color: #ccc;
        }

        /* Students Grid */
        .students-grid-container {
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .student-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            position: relative;
        }

        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .student-name {
            font-size: 11px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-mic-status {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .hand-raised {
            position: absolute;
            top: -5px;
            left: -5px;
            font-size: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Right Sidebar */
        .sidebar {
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2d3748;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #2d3748;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* Chat */
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .chat-message {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            border-left: 3px solid var(--accent);
        }

        .chat-user {
            font-weight: bold;
            color: var(--accent);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .chat-text {
            font-size: 14px;
            color: #e0e0e0;
        }

        .chat-input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: var(--bg);
            border-top: 1px solid #2d3748;
        }

        .chat-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #2d3748;
            border-radius: 25px;
            color: white;
            font-size: 14px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .reaction-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .reaction-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reaction-btn:hover {
            background: var(--primary);
            transform: scale(1.2);
        }

        /* Hand Raise Button */
        .hand-raise-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ed8936, #dd6b20);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .hand-raise-btn.active {
            background: linear-gradient(135deg, #48bb78, #38a169);
        }

        /* Participants List */
        .participant-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .participant-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        .participant-status {
            font-size: 11px;
            color: #888;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            z-index: 100;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stream-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 50vh;
                border-left: none;
                border-top: 1px solid #2d3748;
            }
            .main-video-section {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='index.html'">◀ ወደ ዋና ገጽ</button>

    <div class="stream-layout">
        <!-- Main Video Section -->
        <div class="main-video-section">
            <div class="video-container" id="videoContainer">
                <!-- Video Mode -->
                <video id="mainVideo" autoplay playsinline></video>

                <!-- Audio Mode (Hidden by default) -->
                <div class="audio-live-mode" id="audioLiveMode" style="display: none;">
                    <div class="teacher-avatar-large" id="teacherAvatarLarge">👨‍🏫</div>
                    <div class="teacher-info-overlay">
                        <div class="teacher-name-large" id="teacherNameLarge">መምህር አህመድ</div>
                        <div class="stream-title-large" id="streamTitleLarge">የሱራ አል-ባቃራህ ትርጉም</div>
                    </div>
                    <div class="audio-wave-animation">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                    <div style="color: #48bb78; font-size: 18px;">
                        🔴 በቀጥታ ላይ - የድምጽ ትምህርት
                    </div>
                </div>

                <!-- Top Overlay -->
                <div class="top-overlay">
                    <div class="live-badge">
                        <span class="pulse-dot"></span>
                        LIVE
                    </div>
                    <div class="stream-stats">
                        <div class="stat-badge">
                            <span>👥</span>
                            <span id="viewerCount">0</span>
                        </div>
                        <div class="stat-badge">
                            <span>⏱️</span>
                            <span id="duration">00:00</span>
                        </div>
                    </div>
                </div>

                <!-- Bottom Overlay (Video mode only) -->
                <div class="bottom-overlay" id="bottomOverlay">
                    <div class="teacher-info">
                        <div class="teacher-avatar">👨‍🏫</div>
                        <div class="teacher-details">
                            <h3 id="teacherName">Loading...</h3>
                            <p id="streamTitle">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Students Grid -->
            <div class="students-grid-container">
                <div class="students-grid" id="studentsGrid">
                    <!-- Students will appear here -->
                </div>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchTab('chat')">💬 Chat</button>
                <button class="tab-btn" onclick="switchTab('participants')">👥 ተሳታፊዎች</button>
            </div>

            <div class="tab-content" id="chatTab">
                <button class="hand-raise-btn" id="handRaiseBtn" onclick="raiseHand()">
                    ✋ ጥያቄ አለኝ
                </button>

                <div class="reaction-buttons">
                    <button class="reaction-btn" onclick="sendReaction('❤️')">❤️</button>
                    <button class="reaction-btn" onclick="sendReaction('🤲')">🤲</button>
                    <button class="reaction-btn" onclick="sendReaction('📿')">📿</button>
                    <button class="reaction-btn" onclick="sendReaction('☝️')">☝️</button>
                    <button class="reaction-btn" onclick="sendReaction('👏')">👏</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages here -->
                </div>
            </div>

            <div class="tab-content" id="participantsTab" style="display: none;">
                <div id="participantsList">
                    <!-- Participants here -->
                </div>
            </div>

            <div class="chat-input-area">
                <input 
                    type="text" 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="መልእክት ጻፍ..."
                    maxlength="200"
                >
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module">
        // Stream functionality
        const urlParams = new URLSearchParams(window.location.search);
        const streamId = urlParams.get('id');
        let currentUser = null;
        let handRaised = false;

        setTimeout(init, 1000);

        function init() {
            window.onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    currentUser = user;
                    loadStream();
                    listenToChat();
                    addStudent();
                }
            });

            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        }

        async function loadStream() {
            const streamRef = window.doc(window.db, 'streams', streamId);
            const streamDoc = await window.getDoc(streamRef);
            
            if (streamDoc.exists()) {
                const data = streamDoc.data();
                document.getElementById('teacherName').textContent = data.teacherName;
                document.getElementById('streamTitle').textContent = data.title;
                
                // Check if audio mode
                if (data.streamMode === 'audio') {
                    document.getElementById('mainVideo').style.display = 'none';
                    document.getElementById('audioLiveMode').style.display = 'flex';
                    document.getElementById('bottomOverlay').style.display = 'none';
                    document.getElementById('teacherNameLarge').textContent = data.teacherName;
                    document.getElementById('streamTitleLarge').textContent = data.title;
                }
                
                listenToViewers();
            }
        }

        async function addStudent() {
            const viewerRef = window.doc(window.db, 'viewers', `${streamId}_${currentUser.uid}`);
            await window.setDoc(viewerRef, {
                streamId,
                userId: currentUser.uid,
                userName: 'ተማሪ ' + currentUser.uid.substring(0, 4),
                joinedAt: window.serverTimestamp(),
                handRaised: false
            });

            const streamRef = window.doc(window.db, 'streams', streamId);
            await window.updateDoc(streamRef, {
                viewers: window.increment(1)
            });

            listenToStudents();
        }

        function listenToViewers() {
            const streamRef = window.doc(window.db, 'streams', streamId);
            window.onSnapshot(streamRef, (doc) => {
                if (doc.exists()) {
                    document.getElementById('viewerCount').textContent = doc.data().viewers || 0;
                }
            });
        }

        function listenToStudents() {
            const viewersRef = window.collection(window.db, 'viewers');
            const q = window.query(viewersRef, window.where('streamId', '==', streamId));
            
            window.onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('studentsGrid');
                const list = document.getElementById('participantsList');
                grid.innerHTML = '';
                list.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const student = doc.data();
                    
                    // Grid view
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.innerHTML = `
                        <div class="student-avatar">👤</div>
                        <div class="student-name">${student.userName}</div>
                        ${student.handRaised ? '<div class="hand-raised">✋</div>' : ''}
                    `;
                    grid.appendChild(card);
                    
                    // List view
                    const item = document.createElement('div');
                    item.className = 'participant-item';
                    item.innerHTML = `
                        <div class="participant-avatar">👤</div>
                        <div class="participant-info">
                            <div class="participant-name">${student.userName}</div>
                            <div class="participant-status">
                                ${student.handRaised ? '✋ ጥያቄ አለው' : '👂 በማዳመጥ ላይ'}
                            </div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function listenToChat() {
            const messagesRef = window.collection(window.db, 'streams', streamId, 'messages');
            const q = window.query(messagesRef, window.orderBy('timestamp', 'asc'));

            window.onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        addMessageToChat(msg);
                    }
                });
            });
        }

        function addMessageToChat(msg) {
            const chatDiv = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = 'chat-message';
            messageEl.innerHTML = `
                <div class="chat-user">${msg.userName}</div>
                <div class="chat-text">${msg.message}</div>
            `;
            chatDiv.appendChild(messageEl);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            const messagesRef = window.collection(window.db, 'streams', streamId, 'messages');
            await window.addDoc(messagesRef, {
                userId: currentUser.uid,
                userName: 'ተማሪ ' + currentUser.uid.substring(0, 4),
                message: message,
                timestamp: window.serverTimestamp()
            });

            input.value = '';
        }

        async function raiseHand() {
            handRaised = !handRaised;
            const btn = document.getElementById('handRaiseBtn');
            
            if (handRaised) {
                btn.classList.add('active');
                btn.textContent = '✓ እጅ ተነሳ';
            } else {
                btn.classList.remove('active');
                btn.textContent = '✋ ጥያቄ አለኝ';
            }

            const viewerRef = window.doc(window.db, 'viewers', `${streamId}_${currentUser.uid}`);
            await window.updateDoc(viewerRef, {
                handRaised: handRaised
            });
        }

        function sendReaction(emoji) {
            // Visual effect
            const reaction = document.createElement('div');
            reaction.style.cssText = `
                position: fixed;
                font-size: 40px;
                left: ${Math.random() * 80 + 10}%;
                bottom: 20%;
                animation: float-up 3s ease-out forwards;
                pointer-events: none;
                z-index: 1000;
            `;
            reaction.textContent = emoji;
            document.body.appendChild(reaction);
            setTimeout(() => reaction.remove(), 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('chatTab').style.display = tab === 'chat' ? 'block' : 'none';
            document.getElementById('participantsTab').style.display = tab === 'participants' ? 'block' : 'none';
        }

        window.sendMessage = sendMessage;
        window.raiseHand = raiseHand;
        window.sendReaction = sendReaction;
        window.switchTab = switchTab;

        // Float animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float-up {
                0% { bottom: 20%; opacity: 1; transform: translateY(0) scale(1); }
                100% { bottom: 80%; opacity: 0; transform: translateY(-100px) scale(1.5); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
